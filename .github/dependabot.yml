# Keeps the SHA-pinned Actions current. Pins do not move on their own, so without
# this they would silently go stale. Python locks are regenerated by hand with
# `uv pip compile --generate-hashes` (see docs/api.md) and audited nightly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
